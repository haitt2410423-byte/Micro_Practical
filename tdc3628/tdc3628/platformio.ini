; Mỗi bài là một env. Chọn bài ở thanh trạng thái phía dưới VS Code
; (hoặc: pio run -e p2_adc_lcd -t upload)

[platformio]
default_envs = p1_gpio

[env]
platform = atmelavr
board = ATmega328P
board_build.f_cpu = 16000000L
upload_protocol = usbasp
monitor_speed = 9600
; Chỉ biên dịch thư mục src/<tên env>/
build_src_filter = -<*> +<${PIOENV}/>

[env:p1_gpio]
[env:p2_adc_lcd]
[env:p3_pwm_servo]
[env:p5_scheduler]
[env:p6_stepper]
[env:p7_input_capture]
[env:p8_i2c]
[env:p9_serial_servo]
